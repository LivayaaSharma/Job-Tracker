<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline — JobTracker</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FFF5F6;
      font-family: 'Space Grotesk', system-ui, sans-serif;
      color: #2C3525;
      text-align: center;
      padding: 2rem;
    }
    .card {
      max-width: 360px;
      background: #fff;
      border-radius: 12px;
      padding: 2.5rem 2rem;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    h1 {
      font-family: 'Fraunces', serif;
      font-size: 1.5rem;
      margin: 1rem 0 0.5rem;
    }
    p {
      color: #8FA878;
      font-size: 0.95rem;
      line-height: 1.6;
      margin: 0;
    }
    .mascot {
      width: 64px;
      height: 64px;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/favicon-192x192.png" alt="" class="mascot" />
    <h1>You're offline</h1>
    <p>Connect to the internet and refresh to get back to your applications.</p>
  </div>
</body>
</html>
